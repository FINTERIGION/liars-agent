[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liars-agent"
version = "0.1.0"
description = "骗子酒馆 AI 决策智能体训练与评测平台 (Liar's Bar AI Decision Agent Training & Evaluation)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Xi Rao (@ReXeno56)"},
    {name = "Yuchao Feng (@FINTERIGION)"},
    {name = "Boyan Zhou (@luckydrag0n)"},
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "gradio>=4.0.0",
    "pytest>=7.4.0",
    "openai>=1.0.0",
    "tinker>=0.39.0,<0.40",
    "transformers>=5.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
