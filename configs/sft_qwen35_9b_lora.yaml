experiment_name: qwen35_9b_liars_bar_multitask_v2
base_model: Qwen/Qwen3.5-9B
platform: tinker
seed: 42
opponent_config: opponent_pools.yaml
budget_limit_usd: 5000

dataset:
  total_target_samples: 10000  # action examples
  belief_target_samples: 10000
  num_games: 1000
  max_games: 2000
  workers: 8
  batch_games: 20
  rollout_trajectories_per_state: 8
  min_advantage_margin: 0.05
  split_by: game_id
  train_ratio: 0.8
  val_ratio: 0.1
  history_ablation_augmentation_ratio: 0.0

lora:
  r: 16
  train_attn: true
  train_mlp: true
  train_unembed: false

training:
  batch_size: 32
  learning_rate: 2.0e-4
  num_epochs: 3
  max_seq_length: 16384
  seed: 42
  diagnostic_steps: [50, 100]
  diagnostic_samples_per_task: 64
  action_supervision:
    version: empirical_all_answers_weighted_actions_v3
    positive_gap_weight: 0.5  # configured heuristic, not a probability/confidence
    tie_tolerance: 1.0e-12
    gap_threshold: 0.05
    target_selection: all_acceptable_answers_per_state
    answer_weighting: equal_share_of_state_weight
    action_weight_normalization: train_mean
    checkpoint_selection: val_action_set_nll
    action_ending: first_assistant_eos_inclusive

sampling:
  temperature: 0.2
  top_p: 0.9
  max_new_tokens: 256
  fallback_strategy: card_counter_safe

rs:
  target_samples: 2000
  belief_target_samples: 2000
  num_games: 400
  max_games: 2000
  candidates_per_state: 4
  rollouts_per_candidate: 8
  min_advantage_margin: 0.05
  learning_rate: 5.0e-5
  num_epochs: 1

evaluation:
  num_blocks: 45
  bootstrap_samples: 10000
  unseen_belief_samples: 1000
  unseen_belief_max_games: 1000
  endgame_coverage_dir: endgame_coverage
